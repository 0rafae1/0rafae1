name: Generate GitHub Stats

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # diariamente às 06:00 UTC (03:00 BRT)

# contents: para o job poder commitar/dar push nos SVGs com o GITHUB_TOKEN
# padrão (nunca expira, é gerado novo a cada execução).
# issues: para poder abrir/fechar automaticamente um aviso caso o workflow
# falhe - assim você fica sabendo sem precisar checar o Actions manualmente.
permissions:
  contents: write
  issues: write

concurrency:
  group: stats-update
  cancel-in-progress: true

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate stats SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: 0rafae1
        run: node .github/scripts/generate-stats.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update GitHub stats [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      # Se qualquer step acima falhar, abre (ou comenta numa já existente)
      # uma Issue avisando, em vez de deixar o card ficar desatualizado em
      # silêncio até alguém notar.
      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 GitHub Stats workflow failing";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "stats-workflow",
            });
            const existing = issues.find((i) => i.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `A execução falhou. Veja o log: ${runUrl}`;

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["stats-workflow"],
              });
            }

      # Se tinha uma Issue de falha aberta e essa execução deu certo,
      # comenta e fecha sozinha.
      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 GitHub Stats workflow failing";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "stats-workflow",
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "✅ Voltou a funcionar - fechando automaticamente.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
